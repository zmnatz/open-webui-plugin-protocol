[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owpp-live"
dynamic = ["version"]
description = "owpp live: test Open-WebUI plugins on a real, throwaway Open-WebUI (Docker) with aimock as its models, over its API and in the browser."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Released together with owpp, at the same version (docs/adr/0003-owpp-live-package.md):
# tools/release.py moves this pin with both versions.
dependencies = ["owpp==0.6.3", "pytest>=8", "playwright>=1.50"]
keywords = ["open-webui", "plugins", "testing", "playwright", "docker"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: Pytest",
]

[project.urls]
Repository = "https://github.com/zmnatz/open-webui-plugin-protocol"
Documentation = "https://zmnatz.github.io/open-webui-plugin-protocol/commands/live/"

# `owpp live`, added to owpp's commands.
[project.entry-points."owpp.commands"]
live = "owpp_live.command:register"

# The live fixtures (api, user_api, aimock, admin, user, signed_out), in any pytest run where
# owpp-live is installed.
[project.entry-points.pytest11]
owpp_live = "owpp_live.pytest_plugin"

[tool.hatch.version]
path = "src/owpp_live/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/owpp_live"]

[tool.uv.sources]
owpp = { workspace = true }
