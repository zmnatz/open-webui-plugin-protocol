# What this repository's examples need on top of the Open-WebUI `owpp live` starts (src/owpp/live/
# compose.yaml: Open-WebUI v0.13.5-slim and aimock). `tools/screenshots/run.py` layers this file on
# it for the screenshots and the live suite. See docs/screenshots.md and docs/testing/live.md.

services:
  open-webui:
    environment:
      # The first connection (aimock) answers the chats; the second only says what a LiteLLM
      # gateway would say about the same models (for examples/plugins/litellm_model_sync).
      # Open-WebUI keeps the first connection's entry for a model both list.
      OPENAI_API_BASE_URLS: http://aimock:4010/v1;http://gateway/v1
      OPENAI_API_KEYS: unused;unused
      # owpp live lets every user use every model; here a user who is not an admin needs the read
      # grant litellm_model_sync gives each model, as on a real instance (docs/testing/live.md).
      BYPASS_MODEL_ACCESS_CONTROL: "false"
      # excalidraw and inline_visualizer show pages in the Artifacts panel, which need this on
      # (`requires: iframe_sandbox_allow_same_origin` in their plugin.yaml; owpp deploy warns
      # without it). shots_excalidraw.py turns it off and on again for its "without" shot.
      DEFAULT_INTERFACE_SETTINGS: '{"iframeSandboxAllowSameOrigin": true}'
      # Read by examples/plugins/mcpo_sync, whose MCPO_BASE_URL default is http://mcpo:8000.
      MCPO_API_KEY: mcpo-key
    depends_on: [static]

  static:
    # Fixed files for what the examples talk to besides a model (nginx.conf): a LiteLLM
    # gateway's /model/info as "gateway", and mcpo's OpenAPI documents as "mcpo".
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway:/srv/gateway:ro
      - ./mcpo:/srv/mcpo:ro
    networks:
      default:
        aliases: [gateway, mcpo]
