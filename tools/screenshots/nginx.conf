# Fixed files standing in for two services the examples talk to; see docs/testing/live.md.

# A LiteLLM gateway's /v1/models and /model/info for aimock's models
# (examples/plugins/litellm_model_sync). aimock has no /model/info.
server {
    listen 80;
    root /srv/gateway;
    default_type application/json;
    location / {
        try_files $uri =404;
    }
}

# mcpo, reached as http://mcpo:8000 (examples/plugins/mcpo_sync's default): its /openapi.json
# lists the servers, and each server's /<name>/openapi.json describes its tools. Like mcpo, it
# wants the key: Authorization: Bearer mcpo-key.
server {
    listen 8000;
    root /srv/mcpo;
    default_type application/json;
    location / {
        if ($http_authorization != "Bearer mcpo-key") {
            return 401 '{"detail": "Invalid API key"}';
        }
        try_files $uri =404;
    }
}
