# What a LiteLLM gateway answers about its models, as fixed files: GET /v1/models and
# GET /model/info. aimock has no /model/info, and examples/plugins/litellm_model_sync needs one.
server {
    listen 80;
    root /srv;
    default_type application/json;
    location / {
        try_files $uri =404;
    }
}
