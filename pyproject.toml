[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owpp"
dynamic = ["version"]
description = "Write, test and deploy Open-WebUI plugins (a function plus its tool and skills) from a git repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["open-webui", "plugins", "functions", "tools", "skills", "deploy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# `owpp test` and owpp.testing: pytest, plus the packages Open-WebUI itself ships that plugins and
# the libraries import (the mock Open-WebUI stands in for open_webui.*, not for these).
test = [
  "pytest>=8",
  "fastapi>=0.115",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",  # with greenlet, as Open-WebUI ships it
  "aiohttp>=3.9",
]
# `owpp live`'s browser fixtures (admin, user, signed_out): the command, the stack and the API
# fixtures need only the standard library and Docker.
live = ["pytest>=8", "playwright>=1.50"]

[project.urls]
Repository = "https://github.com/zmnatz/open-webui-plugin-protocol"
Changelog = "https://github.com/zmnatz/open-webui-plugin-protocol/blob/main/CHANGELOG.md"

[project.scripts]
owpp = "owpp.cli:console_main"

# The `owui` and `plugin` fixtures, in any pytest run where owpp is installed.
[project.entry-points.pytest11]
owpp = "owpp.testing.pytest_plugin"

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "fastapi>=0.136.3",  # Open-WebUI v0.13.5 pins 0.136.3
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "starlette>=1.7.0",
    "playwright>=1.50",  # owpp live's browser fixtures, for this repository's live suite
]
docs = [
    "zensical>=0.1.2 ; python_full_version >= '3.11'",
]
screenshots = [
    "playwright>=1.50",
]

[tool.hatch.version]
path = "src/owpp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/owpp"]

[tool.hatch.build.targets.wheel.force-include]
# Type stubs for open_webui, from the mock, so an editor resolves what plugins import (PEP 561).
"src/open_webui-stubs" = "open_webui-stubs"

[tool.hatch.build.targets.sdist]
include = ["src/owpp", "src/open_webui-stubs", "docs", "examples", "skills", "tests", "README.md", "LICENSE", "NOTICE.md", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/plugins"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Classic298's Shared Assets Protocol, vendored byte for byte: never lint or reformat it.
# The open_webui stubs are generated (python -m owpp.testing.stubs).
extend-exclude = [
  "src/owpp/runtime/lib/shared_assets.py",
  "src/owpp/runtime/lib/live_reload.py",
  "src/open_webui-stubs",
]

[tool.ruff.format]
# The runtime and the libraries are copied into every bundle as written: keep their layout.
exclude = ["src/owpp/runtime/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Checked for undefined and unused names only (their imports are real), not restyled.
"src/owpp/runtime/**" = ["E", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
# A plugin's shared.py, imported as `from shared import NAME` (docs/bundling.md).
known-local-folder = ["shared"]
