[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owpp"
dynamic = ["version"]
description = "Write, test and deploy Open-WebUI plugins (a function plus its tool and skills) from a git repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["open-webui", "plugins", "functions", "tools", "skills", "deploy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
