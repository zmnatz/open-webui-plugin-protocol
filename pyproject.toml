[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owpp"
dynamic = ["version"]
description = "Write, test and deploy Open-WebUI plugins (a function plus its tool and skills) from a git repository."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]
keywords = ["open-webui", "plugins", "functions", "tools", "skills", "deploy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# `owpp test` and owpp.testing: pytest, plus the packages Open-WebUI itself ships that plugins and
# the libraries import (the mock Open-WebUI stands in for open_webui.*, not for these).
test = [
  "pytest>=8",
  "fastapi>=0.115",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",  # with greenlet, as Open-WebUI ships it
  "aiohttp>=3.9",
]

[project.urls]
Repository = "https://github.com/zmnatz/open-webui-plugin-protocol"
Changelog = "https://github.com/zmnatz/open-webui-plugin-protocol/blob/main/CHANGELOG.md"

[project.scripts]
owpp = "owpp.cli:console_main"

# The `owui` and `plugin` fixtures, in any pytest run where owpp is installed.
[project.entry-points.pytest11]
owpp = "owpp.testing.pytest_plugin"

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "starlette>=1.7.0",
]
docs = [
    "zensical>=0.1.2 ; python_full_version >= '3.11'",
]
screenshots = [
    "playwright>=1.50",
]

[tool.hatch.version]
path = "src/owpp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/owpp"]

[tool.hatch.build.targets.sdist]
include = ["src/owpp", "docs", "examples", "skills", "tests", "README.md", "LICENSE", "NOTICE.md", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/plugins"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The vendored libraries and the runtime are deployed byte for byte, and the vision router is
# open-webui's file as it is; never reformat them.
extend-exclude = ["src/owpp/runtime", "examples", "tools/live/plugins/vision_router"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
