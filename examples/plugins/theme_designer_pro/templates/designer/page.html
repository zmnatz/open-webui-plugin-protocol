<!DOCTYPE html>
<html lang="en" id="tool-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Designer Pro</title>
    <script>
        // Opened from the Theme Designer Pro tab in Open WebUI's Settings.
        (function () {
            // Or from the Themes page of the Admin Panel (embed=admin).
            var embed = (location.search.slice(1).match(/(?:^|&)embed=(settings|admin)(?:&|$)/) || [])[1];
            if (!embed) return;
            var root = document.documentElement;
            root.classList.add('owui-skin');
            // Overlay Transparency: a clear page lets the dialog's glass show through.
            if (embed !== 'settings' || '{OVERLAY_TRANSPARENCY}' === 'opaque') return;
            root.classList.add('owui-skin-glass');
            // A frame whose color scheme differs from the page around it gets an
            // opaque backdrop, so take the dialog's, and whether it is dark.
            function match() {
                try {
                    var outer = window.parent.document.documentElement;
                    root.style.colorScheme = window.parent.getComputedStyle(outer).colorScheme || '';
                    root.classList.toggle('owui-parent-dark', outer.classList.contains('dark'));
                } catch (e) {}
            }
            match();
            try {
                new MutationObserver(match).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });
            } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
<!--#include styles/designer.css-->
    </style>
    <style id="owui-skin">
<!--#include styles/skin.css-->
    </style>
</head>
<body id="tool-body">

<div id="drop-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(59, 130, 246, 0.1); backdrop-filter:blur(6px); z-index:10000; border: 4px dashed var(--accent); align-items:center; justify-content:center; flex-direction:column; box-sizing:border-box;">
    <div style="font-size: 56px; margin-bottom: 16px; animation: bounce 1s infinite;">📥</div>
    <h2 style="color:var(--text-main); font-weight:800; font-size: 1.5rem; letter-spacing: -0.02em;">Drop Theme JSON to Import</h2>
</div>

<style>
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>

<div class="container" id="theme-designer-container">
    <div class="header">
        <h1>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            Theme Designer Pro | v{VERSION}
        </h1>
        <span class="inactive-badge" id="inactive-badge" data-tooltip="The function is disabled — toggle it ON in Admin → Functions to push themes to users"><span class="inactive-dot"></span> <span id="inactive-badge-text">Theme Inactive</span></span>
        <div class="mode-toggle" id="global-mode-toggle" role="radiogroup" aria-label="Theme mode">
            <button class="mode-btn" data-mode="system" role="radio" aria-checked="false">🖥️ System</button>
            <button class="mode-btn active" data-mode="dark" role="radio" aria-checked="true">🌑 Dark</button>
            <button class="mode-btn" data-mode="oled" role="radio" aria-checked="false">🌌 OLED</button>
            <button class="mode-btn" data-mode="light" role="radio" aria-checked="false">☀️ Light</button>
            <button class="mode-btn" data-mode="her" id="mode-btn-her" style="display: none;" role="radio" aria-checked="false">🌷 Her</button>
        </div>
        <div class="header-btns-wrap" style="display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto;">
            <button class="header-json-btn" id="check-updates-btn" data-tooltip="Check all themes for updates" aria-label="Check all themes for updates">
                <span style="font-size: 13px; line-height: 1;">⟳</span>
                <span class="btn-label">Updates</span>
            </button>
            <button class="header-json-btn" id="ai-consult-btn" data-tooltip="Describe a theme in words and let a model pick its colors" aria-label="AI: describe a theme in words and let a model pick its colors" aria-haspopup="dialog">
                <span style="font-size: 13px; line-height: 1;">✨</span>
                <span class="btn-label">AI</span>
            </button>
            <button class="header-json-btn" id="json-view-btn" data-tooltip="View current theme as JSON" aria-label="View current theme as JSON">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>
                <span class="btn-label">JSON</span>
            </button>
            <button class="header-json-btn" id="css-view-btn" data-tooltip="Copy or download the current theme as CSS" aria-label="Copy or download the current theme as CSS" aria-haspopup="dialog">
                <span style="font-size: 13px; line-height: 1;">📋</span>
                <span class="btn-label">CSS</span>
            </button>
            <button class="header-json-btn" id="docs-modal-btn" data-tooltip="Open documentation" aria-label="Docs: open documentation">
                <span style="font-size: 13px; line-height: 1;">📖</span>
                <span class="btn-label">Docs</span>
            </button>
        </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Designer sections">
        <button type="button" class="plain-button tab active" id="tab-btn-themes" data-tab="themes" role="tab" aria-controls="tab-themes" aria-selected="true" tabindex="0">🎭 Themes</button>
        <button type="button" class="plain-button tab" id="tab-btn-lch" data-tab="lch" role="tab" aria-controls="tab-lch" aria-selected="false" tabindex="-1">🎨 Core Palette</button>
        <button type="button" class="plain-button tab" id="tab-btn-custom" data-tab="custom" role="tab" aria-controls="tab-custom" aria-selected="false" tabindex="-1">✏️ Style Overrides</button>
        <button type="button" class="plain-button tab" id="tab-btn-canvas" data-tab="canvas" role="tab" aria-controls="tab-canvas" aria-selected="false" tabindex="-1">✨ Canvas FX</button>
        <button type="button" class="plain-button tab" id="tab-btn-bg" data-tab="bg" role="tab" aria-controls="tab-bg" aria-selected="false" tabindex="-1">🌈 Gradient</button>
        <button type="button" class="plain-button tab" id="tab-btn-surfaces" data-tab="surfaces" role="tab" aria-controls="tab-surfaces" aria-selected="false" tabindex="-1">🪟 Surfaces</button>
        <button type="button" class="plain-button tab" id="tab-btn-backgrounds" data-tab="backgrounds" role="tab" aria-controls="tab-backgrounds" aria-selected="false" tabindex="-1">🖼️ Backgrounds</button>
    </div>

    <div class="content-area">

<!--#include tabs/lch.html-->
<!--#include tabs/custom.html-->
<!--#include tabs/canvas.html-->
<!--#include tabs/bg.html-->
<!--#include tabs/surfaces.html-->
<!--#include tabs/backgrounds.html-->
<!--#include tabs/themes.html-->
<!--#include docs.html-->
    </div>

    <div class="footer">
        <div class="footer-left">
            <button class="btn btn-danger" id="nuclear-btn" data-tooltip="Reset all modes to default">Global Reset</button>
            <button class="btn btn-danger" id="reset-mode-btn" data-tooltip="Reset only the current mode to default" style="opacity: 0.85;">Reset Mode</button>
            <button class="btn" id="sync-mode-btn" data-tooltip="Copy settings from one mode to another (e.g., Dark → Light) and choose what to sync">Sync</button>
            <label id="sync-all-toggle-wrap" class="sync-all-toggle" style="display:none;" data-tooltip="When enabled, loading presets and syncing applies to all 4 modes automatically">
                <input type="checkbox" id="sync-all-modes-toggle" class="cb-input">
                <span style="font-size:0.6rem; font-weight:600; opacity:0.85; white-space:nowrap;">Sync All</span>
            </label>

            <div style="display: flex; gap: 4px; margin-left: 8px; border-left: 1px solid var(--border); padding-left: 12px;">
                <button class="btn btn-icon" id="undo-btn" data-tooltip="Undo (Ctrl+Z)" aria-label="Undo" disabled style="width: 32px; height: 32px; opacity: 0.5;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                </button>
                <button class="btn btn-icon" id="redo-btn" data-tooltip="Redo (Ctrl+Y)" aria-label="Redo" disabled style="width: 32px; height: 32px; opacity: 0.5;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
                </button>
            </div>
        </div>
        <div id="action-toast" class="action-toast"></div>
        <div class="footer-right">
            <div class="draft-toggle" id="draft-toggle-wrap">
                <span class="draft-toggle-label active" id="draft-label-live">Live</span>
                <button type="button" class="plain-button draft-switch" id="draft-switch" role="switch" aria-checked="false" aria-label="Draft mode" data-tooltip="Click to enter Draft mode — changes will stay local until you Publish"></button>
                <span class="draft-toggle-label" id="draft-label-draft"><span class="draft-dot" style="display:none;" id="draft-dot"></span> Draft</span>
            </div>
            <button class="draft-publish-btn" id="draft-publish-btn" data-tooltip="Push all changes live">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                Publish
            </button>
        </div>
        <input type="file" id="image-input" accept="image/*" style="display:none" multiple>
    </div>

    <div id="save-modal" class="modal-overlay z-low" role="dialog" aria-modal="true" aria-labelledby="save-modal-title">
        <div class="control-group modal-panel-save">
            <div class="modal-icon modal-icon-save">💾</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                <div class="section-title" id="save-modal-title" style="margin: 0;">Save Theme Snapshot</div>
                <button class="btn" id="save-json-edit-btn" style="font-size: 0.6rem; padding: 5px 12px; border-radius: 8px; white-space: nowrap;" data-tooltip="Edit snapshot as raw JSON before saving">{ } Manual Editor</button>
            </div>
            <!--#include parts/save-metadata.html-->
            <div class="flex-end">
                <button class="btn" data-dismiss="save-modal">Cancel</button>
                <button class="btn btn-primary" id="confirm-save-btn">Save Theme</button>
            </div>
        </div>
    </div>

    <div id="modal-factory-container"></div>

    <div id="rename-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="rename-modal-title">
        <div class="control-group modal-panel-save modal-panel-neutral" style="border-color: var(--border);">
            <div class="modal-icon modal-icon-save">✏️</div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                <div class="section-title" id="rename-modal-title" style="margin: 0;">Edit Theme Snapshot</div>
                <button class="btn" id="snapshot-json-edit-btn" style="font-size: 0.6rem; padding: 5px 12px; border-radius: 8px; white-space: nowrap;" data-tooltip="Edit snapshot as raw JSON">{ } Manual Editor</button>
            </div>
            <!--#include parts/rename-metadata.html-->
            <div class="flex-end">
                <button class="btn" data-dismiss="rename-modal">Cancel</button>
                <button class="btn btn-primary" id="confirm-rename-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="update-modal" class="modal-overlay z-high" role="dialog" aria-modal="true" aria-labelledby="update-modal-title">
        <div class="control-group modal-panel modal-panel-neutral" style="width: 480px; max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column;">
            <div class="modal-icon modal-icon-update">⟳</div>
            <div class="section-title" id="update-modal-title" style="justify-content:center; margin-bottom: 8px;">Update Available</div>
            <p id="update-modal-info" style="font-size: 0.78rem; color:var(--text-muted); margin-bottom:20px; line-height:1.6; text-align:center;"></p>
            <div id="update-modal-details" style="background: var(--bg-deep); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; font-size: 0.72rem; line-height: 1.7; color: var(--text-muted);"></div>
            <div id="update-canvas-warning" style="display:none; background:rgba(239, 68, 68, 0.1); border:1px solid rgba(239, 68, 68, 0.3); border-radius:12px; padding:12px; margin-bottom:12px; text-align:left;"></div>
            <div id="update-diff-toggle-wrap" style="text-align: center; margin-bottom: 12px; display: none;">
                <button class="btn" id="update-diff-toggle-btn" style="font-size: 0.65rem; opacity: 0.7; padding: 5px 14px;">▸ View Changes</button>
            </div>
            <div id="update-diff-panel" style="display: none; flex: 1; min-height: 0; overflow: hidden; margin-bottom: 12px;"></div>
            <div class="flex-end" style="flex-shrink: 0;">
                <button class="btn" id="update-skip-btn">Cancel</button>
                <button class="btn" id="update-ignore-btn" style="color: var(--text-muted);">Ignore This Update</button>
                <button class="btn btn-primary" id="update-confirm-btn" style="background: #10b981;">Update Theme</button>
            </div>
        </div>
    </div>

    <div id="update-results-modal" class="modal-overlay z-high" role="dialog" aria-modal="true" aria-labelledby="update-results-modal-title">
        <div class="control-group modal-panel modal-panel-neutral" style="width: 420px; max-width: 90vw; max-height: 70vh; overflow-y: auto;">
            <div class="modal-icon modal-icon-update">⟳</div>
            <div class="section-title" id="update-results-modal-title" style="justify-content:center; margin-bottom: 8px;">Update Check Results</div>
            <div id="update-results-list" style="margin-bottom: 20px;"></div>
            <div style="display:flex; gap:12px; justify-content:flex-end; align-items:center;">
                <button class="btn btn-primary" id="update-all-btn" style="background:#10b981; display:none;" data-action="apply-all-updates">Update All</button>
                <button class="btn" data-dismiss="update-results-modal">Close</button>
            </div>
        </div>
    </div>

    <div id="sync-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="sync-modal-title">
        <div class="control-group modal-panel modal-panel-info" style="width: 820px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column;">
            <div class="modal-icon modal-icon-info">🔄</div>
            <div class="section-title" id="sync-modal-title" style="color:var(--accent); justify-content:center; margin-bottom: 8px;">Selective Sync</div>
            <p id="sync-source-description" style="font-size: 0.75rem; color:var(--text-muted); margin-bottom:24px; line-height:1.6;">Choose what to copy from <b><span id="sync-source-mode"></span></b>.</p>

            <div style="flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: thin;">
                <div class="section-title" style="margin: 0 0 12px; font-size: 0.55rem; color: var(--accent); opacity: 0.8; letter-spacing: 1.5px; display: flex; justify-content: space-between; align-items: center;">
                    <span>1. Target Modes</span>
                    <button type="button" class="plain-button" id="sync-toggle-targets" style="text-transform: none; font-size: 0.55rem; cursor: pointer; letter-spacing: 0.5px; opacity: 0.7; transition: 0.2s;">Deselect All</button>
                </div>
                <div id="sync-target-container" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 24px;"></div>

                <div class="section-title" style="margin: 0 0 12px; font-size: 0.55rem; color: var(--accent); opacity: 0.8; letter-spacing: 1.5px; display: flex; justify-content: space-between; align-items: center;">
                    <span>2. Sync Settings</span>
                    <button type="button" class="plain-button" id="sync-toggle-options" style="text-transform: none; font-size: 0.55rem; cursor: pointer; letter-spacing: 0.5px; opacity: 0.7; transition: 0.2s;">Deselect All</button>
                </div>
                <div style="margin-bottom: 24px;">
                    <!--#include parts/sync-options.html-->
                </div>
            </div>

            <div style="display:flex; gap:12px; justify-content:center;">
                <button class="btn" id="sync-cancel-btn" style="flex:1;" data-dismiss="sync-modal">Do Not Sync</button>
                <button class="btn btn-primary" id="confirm-sync-btn" style="flex:1;">Sync Selected</button>
            </div>
        </div>
    </div>

    <!--#include parts/json-editor-modals.html-->

</div>

<script type="text/plain" id="bootloader-src">{BOOTLOADER_SRC}</script>

</body>
