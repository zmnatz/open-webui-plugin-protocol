# Inline Visualizer tool and skill, from Classic298/open-webui-plugins, installed by this function.
# To upgrade: `owpp sync inline_visualizer` moves `ref` to the latest commit; review the diff, then commit.
protocol: "0.2"
source:
  git: https://github.com/Classic298/open-webui-plugins.git
  ref: 917c88f3029c0c6500139ba7b7b061f358d8aaea
  path: inline-visualizer-v2
function:
  title: Inline Visualizer
  author: zmnatz
  version: 1.0.0
  license: MIT
  global: true
  description: Installs the Inline Visualizer tool and its visualize skill from Classic298/open-webui-plugins; disabling this function removes both.
tool:
  id: inline_visualizer
  file: tool.py
  access: public
skills:
  visualize:
    file: SKILL.md
    access: public
requires:
  iframe_sandbox_allow_same_origin: true # live rendering needs a session in the Artifacts panel; see README
