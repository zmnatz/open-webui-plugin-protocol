name: merge-back
# After a release or hotfix merges into main, merges main back into develop with a merge commit
# (docs/contributing.md#branches), with zmnatz/github-workflows. On a conflict it leaves the pull
# request open with the steps to resolve it, and fails. Run it by hand (Actions > merge-back) to retry.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-back
jobs:
  merge-back:
    uses: zmnatz/github-workflows/.github/workflows/gitflow-merge-back.yml@v1
    with:
      version-command: >-
        sed -n 's/^__version__ = "\(.*\)"/\1/p' src/owpp/__init__.py
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
