name: release
# Starts a release or a hotfix (docs/contributing.md#releasing). Run by hand: Actions > release >
# Run workflow. Cuts release/<version> from develop (or hotfix/<version> from main), prepares it
# with tools/release.py (the version, the dated changelog section, the docs' pins), pushes it and
# opens its pull request into main. Merging that pull request tags the release (tag.yml) and merges
# main back into develop (merge-back.yml).
#
# Uses the RELEASE_TOKEN secret, so the pull request's checks start: GitHub starts no workflows for
# what a workflow's own token does.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or the new version (such as 0.5.0)"
        required: true
        default: minor
      kind:
        description: "release: from develop. hotfix: from main, a patch, opened as a draft for the fix."
        type: choice
        options: [release, hotfix]
        default: release
permissions:
  contents: read # the writes use RELEASE_TOKEN
concurrency:
  group: release
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set (docs/contributing.md#releasing)"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.kind == 'hotfix' && 'main' || 'develop' }}
          token: ${{ secrets.RELEASE_TOKEN }}
      - id: prepare
        env:
          HOW: ${{ inputs.version }}
          KIND: ${{ inputs.kind }}
        run: |
          if [ "$KIND" = hotfix ]; then
            version=$(python3 tools/release.py prepare "$HOW" --hotfix)
          else
            version=$(python3 tools/release.py prepare "$HOW")
          fi
          branch="$KIND/$version"
          if git ls-remote --exit-code origin "refs/heads/$branch" "refs/tags/v$version" >/dev/null; then
            echo "::error::$branch or the tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          KIND: ${{ inputs.kind }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore: prepare the $VERSION $KIND"
          git push origin "$BRANCH"
          if [ "$KIND" = hotfix ]; then
            draft=--draft
            body="Hotfix $VERSION, cut from \`main\`. Push the fix to \`$BRANCH\` with its changelog entry under \`## $VERSION\`, then mark this ready and merge it with a merge commit."
          else
            draft=
            body="Release $VERSION, cut from \`develop\`. Only fixes for the release go on \`$BRANCH\` now. Merge with a merge commit: that tags v$VERSION, publishes it, and merges \`main\` back into \`develop\`."
          fi
          if python3 tools/release_notes.py "v$VERSION" > notes.md 2>/dev/null; then
            body="$body"$'\n\n## Changelog\n\n'"$(cat notes.md)"
          fi
          gh pr create $draft --base main --head "$BRANCH" --title "chore: $KIND $VERSION" --body "$body"
