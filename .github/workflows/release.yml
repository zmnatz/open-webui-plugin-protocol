name: release
# Starts a release or a hotfix (docs/contributing.md#releasing). Run by hand: Actions > release >
# Run workflow. zmnatz/github-workflows cuts release/<version> from develop (or hotfix/<version> from
# main), prepares it with tools/release.py (the version, the dated changelog section, the docs' pins),
# and opens its pull request into main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or the new version (such as 0.5.0)"
        required: true
        default: minor
      kind:
        description: "release: from develop. hotfix: from main, a patch, opened as a draft for the fix."
        type: choice
        options: [release, hotfix]
        default: release
permissions:
  contents: read
concurrency:
  group: release
jobs:
  release:
    uses: zmnatz/github-workflows/.github/workflows/gitflow-release.yml@v1
    with:
      version: ${{ inputs.version }}
      kind: ${{ inputs.kind }}
      prepare-command: python3 tools/release.py prepare "$HOW" $([ "$KIND" = hotfix ] && echo --hotfix)
      notes-command: python3 tools/release_notes.py "v$VERSION"
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
