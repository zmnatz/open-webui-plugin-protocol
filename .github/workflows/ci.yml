name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # The Open-WebUI code the test harness runs (owpp.testing.wheel), keyed on its pin.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/owpp
          key: owpp-open-webui-${{ hashFiles('src/owpp/testing/pin.py') }}
      # The Python the pinned Open-WebUI runs on (.python-version, ADR 0004).
      - run: uv sync
      - name: The Open-WebUI pin matches upstream's slim lock
        run: python3 tools/sync_open_webui.py --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Run the example plugins' tests the way a plugin repository would
        run: uv run owpp test --dir examples/plugins
      - name: Check the examples against their real upstream sources
        run: uv run owpp check --strict --dir examples/plugins
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The built wheel runs and carries the runtime
        run: uvx --from dist/*.whl owpp check --dir examples/plugins mcpo_sync
      - name: The built wheel carries owpp live's stack
        run: uvx --from dist/*.whl python -c "from owpp.live.stack import COMPOSE, DEFAULT_FIXTURES; assert COMPOSE.is_file() and (DEFAULT_FIXTURES / 'models.json').is_file()"
  release:
    # A release or hotfix pull request into main (docs/contributing.md#releasing): checks now what
    # releasing needs after the merge, that v<__version__> is new and CHANGELOG.md has a dated
    # section for it with entries. Skipped on other pull requests.
    uses: zmnatz/github-workflows/.github/workflows/gitflow-release-check.yml@v1
    with:
      version-command: >-
        sed -n 's/^__version__ = "\(.*\)"/\1/p' src/owpp/__init__.py
      notes-command: python3 tools/release_notes.py "v$VERSION"
