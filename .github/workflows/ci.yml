name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Run the example plugins' tests the way a plugin repository would
        run: uv run owpp test --dir examples/plugins
      - name: Check the examples against their real upstream sources
        run: uv run owpp check --strict --dir examples/plugins
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The built wheel runs and carries the runtime
        run: uvx --from dist/*.whl owpp check --dir examples/plugins mcpo_sync
  release:
    # A release or hotfix pull request into main (docs/contributing.md#releasing): check now what
    # publish.yml checks after the merge, that v<__version__> is new and CHANGELOG.md has a dated
    # section for it with entries.
    if: >-
      github.base_ref == 'main' &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/owpp/__init__.py)"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is already released: set the new version (tools/release.py prepare)"
            exit 1
          fi
          python3 tools/release_notes.py "$tag"
