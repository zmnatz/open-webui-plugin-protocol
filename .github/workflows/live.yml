name: live
# The live suite (docs/testing/live.md): `owpp live` deploys examples/plugins to a real Open-WebUI
# (the version the protocol targets, -slim) with aimock as its models and nginx serving fixed files,
# then asserts on what it does (tools/live), over the API and in Chromium. Runs on every pull
# request and push to main, like ci.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group screenshots
      # The tests that drive the chat page (tools/live/test_in_the_browser.py) need Chromium.
      - run: uv run playwright install --with-deps chromium
      # The stack's images, kept between runs. compose.yaml pins every one, so its hash is the key:
      # a new pin pulls once, then loads from the cache.
      - id: images
        uses: actions/cache@v4
        with:
          path: ~/images.tar
          key: live-images-${{ hashFiles('src/owpp/live/compose.yaml', 'tools/screenshots/compose.yaml') }}
      - if: steps.images.outputs.cache-hit == 'true'
        run: docker load --input ~/images.tar
      - if: steps.images.outputs.cache-hit != 'true'
        run: |
          export OWPP_LIVE_FIXTURES=$PWD/tools/screenshots/aimock
          files="-f src/owpp/live/compose.yaml -f tools/screenshots/compose.yaml"
          docker compose $files pull
          docker save --output ~/images.tar $(docker compose $files config --images)
      - run: uv run python tools/screenshots/run.py --live
