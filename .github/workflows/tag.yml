name: tag
# Tags a release when it merges into main (docs/contributing.md#releasing): main moves only for a
# release or hotfix, so a push to main whose __version__ has no v<version> tag yet is one. Only
# tags: what a release does (publish.yml, docs.yml) runs on the tag.
#
# Pushes the tag with the RELEASE_TOKEN secret, because GitHub starts no workflows for a tag
# pushed with a workflow's own token, and then nothing would be released.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tag
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: RELEASE_TOKEN is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set (docs/contributing.md#releasing): a tag pushed without it releases nothing"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - run: |
          tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/owpp/__init__.py)"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged: nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "owpp ${tag#v}"
          git push origin "$tag"
          echo "Tagged $tag: publish.yml and docs.yml release it"
