name: docs
# Builds the documentation site (zensical.toml, tools/build_docs.py) on every pull request, and publishes it to GitHub
# Pages from each v* tag, so the site is the latest release. To publish again, run it by hand on the tag.
# Once per repository: Settings > Pages > Source: GitHub Actions, and the github-pages environment allows v* tags.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group docs --python 3.13 # Zensical needs 3.11+
      - run: uv run python tools/build_docs.py # fails on a broken link, or an example missing from the menu
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
