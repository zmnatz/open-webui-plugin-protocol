name: screenshots
# Takes the documentation screenshots on a real Open-WebUI (docs/screenshots.md): starts
# tools/screenshots/compose.yaml, deploys examples/plugins, follows the plugins' By hand steps in
# Chromium. Run by hand (Actions > screenshots > Run workflow); it uploads docs/screenshots/ as an
# artifact to review and commit. Heavy (a ~4.5 GB image), so never on every push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group screenshots --python 3.13
      - run: uv run playwright install --with-deps chromium
      - run: uv run python tools/screenshots/run.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
