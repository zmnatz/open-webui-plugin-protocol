name: Deploy Open-WebUI plugins
description: Check a folder of Open-WebUI plugins and deploy them (functions, with their tools and skills) to an instance.
branding:
  icon: upload-cloud
  color: blue
inputs:
  url:
    description: Base URL of the Open-WebUI instance. Sets OPEN_WEBUI_URL (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#open_webui_url).
    required: true
  api-key:
    description: An Open-WebUI admin API key (store it as a secret). Optional; without it the deploy signs in with the inputs below, or with nothing. Sets OPEN_WEBUI_API_KEY (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#open_webui_api_key).
    default: ""
  username:
    description: An admin's email (or LDAP user name), with password, when there is no api-key. Sets OPEN_WEBUI_USERNAME (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#open_webui_username).
    default: ""
  password:
    description: That admin's password (store it as a secret). Sets OPEN_WEBUI_PASSWORD (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#open_webui_password).
    default: ""
  oidc-token:
    description: An OIDC access token exchanged for an Open-WebUI session (the instance must set ENABLE_OAUTH_TOKEN_EXCHANGE=true). Sets OPEN_WEBUI_OIDC_TOKEN (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#open_webui_oidc_token).
    default: ""
  oauth-provider:
    description: The Open-WebUI OAuth provider the oidc-token is from. Sets OPEN_WEBUI_OAUTH_PROVIDER (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#open_webui_oauth_provider).
    default: oidc
  plugins-dir:
    description: The plugins folder, relative to the repository root. Sets OWPP_PLUGINS_DIR (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#owpp_plugins_dir).
    default: plugins
  managed-by:
    description: Ownership marker written on deployed functions; pruning only touches functions carrying it. Keep it stable. Sets OWPP_MANAGED_BY (https://zmnatz.github.io/open-webui-plugin-protocol/environment-variables/#owpp_managed_by).
    default: open-webui-plugin-protocol
  only:
    description: Comma-separated plugin ids to deploy (no pruning). Empty deploys all.
    default: ""
  dry-run:
    description: '"true" lists what would change, with versions, without writing.'
    default: "false"
  latest:
    description: 'With dry-run: "true" reports against the latest commit each git-sourced plugin follows (as `owpp pull` would), without changing plugin.yaml.'
    default: "false"
  check:
    description: '"false" skips `owpp check` before deploying.'
    default: "true"
  since:
    description: 'A git ref (e.g. origin/main): `owpp check` also fails when a plugin changed since it without a new version. Needs that ref fetched (actions/checkout with fetch-depth: 0).'
    default: ""
  force:
    description: '"true" deploys even where the instance runs a newer version than the repository (a downgrade).'
    default: "false"
  no-prune:
    description: '"true" creates and updates but deletes nothing; the report lists what a full deploy would delete.'
    default: "false"
  cache:
    description: '"true" keeps .owpp/store (the pinned files from git) between runs, in the GitHub Actions cache. Other workflows of the repository can write that cache, so turn it on only when you trust each of them (https://zmnatz.github.io/open-webui-plugin-protocol/testing/ci/#caching-the-git-sources).'
    default: "false"
  from:
    description: 'A folder `owpp build` wrote, to deploy instead of plugins-dir (no checkout or git sources needed). Skips `owpp check`, which belongs where the build is made.'
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    # Where owpp keeps what it takes from git: .owpp/ beside the plugins folder, or inside a
    # plugins folder that is its own repository.
    - name: Find the git sources
      id: sources
      if: inputs.cache == 'true' && inputs.from == ''
      shell: bash
      env:
        PLUGINS: ${{ inputs.plugins-dir }}
      run: |
        project=$(dirname -- "$PLUGINS")
        if [ -e "$PLUGINS/.git" ]; then project="$PLUGINS"; fi
        echo "store=$project/.owpp/store" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      if: inputs.cache == 'true' && inputs.from == ''
      with:
        path: ${{ steps.sources.outputs.store }}
        key: owpp-store-${{ hashFiles(format('{0}/**/plugin.yaml', inputs.plugins-dir)) }}
    - name: Check plugins
      if: inputs.check == 'true' && inputs.from == ''
      shell: bash
      env:
        OWPP_PLUGINS_DIR: ${{ inputs.plugins-dir }}
        SINCE: ${{ inputs.since }}
      run: |
        args=(check)
        if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
        uvx --from "$GITHUB_ACTION_PATH" owpp "${args[@]}"
    - name: Deploy plugins
      shell: bash
      env:
        OPEN_WEBUI_URL: ${{ inputs.url }}
        OPEN_WEBUI_API_KEY: ${{ inputs.api-key }}
        OPEN_WEBUI_USERNAME: ${{ inputs.username }}
        OPEN_WEBUI_PASSWORD: ${{ inputs.password }}
        OPEN_WEBUI_OIDC_TOKEN: ${{ inputs.oidc-token }}
        OPEN_WEBUI_OAUTH_PROVIDER: ${{ inputs.oauth-provider }}
        OWPP_PLUGINS_DIR: ${{ inputs.plugins-dir }}
        OWPP_MANAGED_BY: ${{ inputs.managed-by }}
        ONLY: ${{ inputs.only }}
        DRY_RUN: ${{ inputs.dry-run }}
        LATEST: ${{ inputs.latest }}
        FORCE: ${{ inputs.force }}
        NO_PRUNE: ${{ inputs.no-prune }}
        FROM: ${{ inputs.from }}
      run: |
        args=(deploy)
        if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        if [ "$LATEST" = "true" ]; then args+=(--latest); fi
        if [ "$FORCE" = "true" ]; then args+=(--force); fi
        if [ "$NO_PRUNE" = "true" ]; then args+=(--no-prune); fi
        if [ -n "$FROM" ]; then args+=(--from "$FROM"); fi
        uvx --from "$GITHUB_ACTION_PATH" owpp "${args[@]}"
