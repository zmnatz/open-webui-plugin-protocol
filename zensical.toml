# The documentation site, built with Zensical and published to GitHub Pages by
# .github/workflows/docs.yml. Build it with tools/build_docs.py, not `zensical` directly:
#
#   uv run --group docs python tools/build_docs.py          # build into site/
#   uv run --group docs python tools/build_docs.py serve    # preview
#
# The script assembles docs/ and the generated pages (test catalogue, examples,
# changelog, license) into build/docs/, which is what Zensical builds.

[project]
site_name = "Open-WebUI plugin protocol"
site_description = "Write, test and deploy Open-WebUI plugins from a git repository."
site_url = "https://zmnatz.github.io/open-webui-plugin-protocol/"
repo_url = "https://github.com/zmnatz/open-webui-plugin-protocol"
repo_name = "zmnatz/open-webui-plugin-protocol"
docs_dir = "build/docs"
site_dir = "site"

nav = [
  { "Home" = "README.md" },
  { "Getting started" = [
    { "Install" = "install.md" },
    { "Your first plugin" = "getting-started.md" },
    { "With an AI agent" = "ai-agents.md" },
  ] },
  { "Guide" = [
    { "Creating a plugin" = "creating.md" },
    { "Authoring a plugin" = "authoring.md" },
    { "Plugin format" = "plugin-format.md" },
    { "Bundling" = "bundling.md" },
    { "Runtime" = "runtime.md" },
    { "Libraries" = "libraries.md" },
    { "Testing" = "testing.md" },
    { "Tooling and CI" = "tooling.md" },
    { "Adopting it" = "adopting.md" },
    { "Upgrading owpp" = "upgrading.md" },
  ] },
  { "Commands" = [
    { "owpp list" = "commands/list.md" },
    { "owpp check" = "commands/check.md" },
    { "owpp bundle" = "commands/bundle.md" },
    { "owpp deploy" = "commands/deploy.md" },
    { "owpp test" = "commands/test.md" },
    { "owpp pull" = "commands/pull.md" },
    { "owpp version" = "commands/version.md" },
    { "owpp migrate" = "commands/migrate.md" },
    { "owpp create" = "commands/create.md" },
    { "owpp init" = "commands/init.md" },
  ] },
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Excalidraw" = "examples/excalidraw.md" },
    { "Inline Visualizer" = "examples/inline_visualizer.md" },
    { "mcpo Sync" = "examples/mcpo_sync.md" },
    { "Page Banners" = "examples/page_banners.md" },
    { "Stale Data Dashboard" = "examples/stale_data.md" },
    { "LiteLLM Model Sync" = "examples/litellm_model_sync.md" },
  ] },
  { "Review" = [
    { "Reviewing a change" = "reviewing.md" },
    { "Test catalogue" = "reference/test-catalogue.md" },
    { "Screenshots" = "reference/screenshots.md" },
    { "Taking screenshots" = "screenshots.md" },
  ] },
  { "Project" = [
    { "Changelog" = "project/changelog.md" },
    { "Contributing" = "contributing.md" },
    { "Security" = "project/security.md" },
    { "License" = "project/license.md" },
    { "Notice" = "project/notice.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.path",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
"pymdownx.details" = {}
"pymdownx.superfences" = {}
